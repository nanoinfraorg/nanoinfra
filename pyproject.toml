[project]
name = "nanoinfra"
version = "1.1.3"
description = "A lightweight self-hosted AI agent for infrastructure"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Xubin Ren"},
    {name = "the nanobot contributors"},
    {name = "Alberto Ferrer"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "anthropic>=0.100.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    # The upper bound keeps this on a tested major. The packages that ask for <16 --
    # slack_sdk[optional] and openai[realtime] -- do so in extras this project does not install,
    # so they do not constrain it. (The old note here cited Feishu's lark-oapi, which left in
    # v0.14.0 with the channel.)
    "websockets>=15.0,<17.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "lxml-html-clean>=0.4.0,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "filelock>=3.25.2",
    "watchfiles>=1.1.1,<2.0.0",
    "packaging>=24.0",
    "tzdata>=2025.2",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    # The OpenAI-compatible API server. Same story as the transports below: it is a
    # surface this project documents and ships a compose service for, and it was an
    # extra, so `nanoinfra serve` in the published image answered ModuleNotFoundError.
    "aiohttp>=3.9.0,<4.0.0",
    # The transports. These were an extra, and the image installs no extras, so the
    # published container could not reach a server over SSH, Ansible or SSM -- which
    # is the whole product. An agent for infrastructure that has to be told to
    # install the ability to reach infrastructure has the default the wrong way round.
    "asyncssh>=2.14.0,<3.0.0",
    "ansible-runner>=2.4.0,<3.0.0",
    "boto3>=1.43.0",
    "pytest-playwright>=0.8.0",
    "cryptography>=42.0.0,<46.0.0",
]

[project.urls]
Homepage = "https://github.com/nanoinfraorg/nanoinfra"
Repository = "https://github.com/nanoinfraorg/nanoinfra"
Issues = "https://github.com/nanoinfraorg/nanoinfra/issues"
Changelog = "https://docs.nanoinfra.org/release-archive/"

[project.optional-dependencies]
api = [
    # Compatibility extra: aiohttp is bundled since v1.0.2.
    "aiohttp>=3.9.0,<4.0.0",
]
azure = [
    "azure-identity>=1.19.0,<2.0.0",
]
bedrock = [
    "boto3>=1.43.0",
]
secrets-postgres = [
    "psycopg[binary]>=3.1.0,<4.0.0",
]
documents = [
    # Compatibility extra: document readers are bundled since v0.2.3.
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
]
langfuse = [
    "langfuse>=3.0.0,<4.0.0",
]
pdf = [
    # Compatibility extra: PDF reading is bundled since v0.2.3.
    "pypdf>=5.0.0,<6.0.0",
]
olostep = [
    "olostep>=0.1.0; python_version < '3.14'",
]
servers = [
    # Compatibility extra: the transports are bundled since v1.0.2. Kept so
    # `nanoinfra[servers]` in somebody's requirements file keeps resolving.
    "asyncssh>=2.14.0,<3.0.0",
    "ansible-runner>=2.4.0,<3.0.0",
    "boto3>=1.43.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.39.0,<2.0.0",
    "pymupdf>=1.25.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "respx>=0.21.0,<1.0.0",
]

[project.scripts]
nanoinfra = "nanoinfra.cli.commands:app"

# Third-party tool plugins register here.  Built-in tools are discovered
# automatically via pkgutil scanning in ToolLoader.discover().
# [project.entry-points."nanoinfra.tools"]
# my_plugin = "my_package.plugins:MyTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
# Implementation lives in the conventional `hatch_build.py` at the repo root.

[tool.hatch.build]
include = [
    "nanoinfra/**/*.py",
    "nanoinfra/templates/**/*.md",
    "nanoinfra/skills/**/*.md",
    "nanoinfra/skills/**/*.sh",
    # A connector ships its own skill beside its manifest, so the file has to travel with the
    # wheel: a connector whose skill is missing is a connector the model uses by guessing.
    "nanoinfra/connectors/**/*.md",
    "nanoinfra/channels/*/webui/**/*",
    "nanoinfra/connectors/*/webui/**/*",
    "nanoinfra/web/dist/**/*",
]
# nanoinfra/web/dist/ is produced by `cd webui && bun run build` and is
# git-ignored. List it as an artifact so hatch ships it in both wheel and
# sdist even though VCS does not track it.
artifacts = [
    "nanoinfra/web/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["nanoinfra"]
exclude = ["nanoinfra/channels/*/tests/**"]

[tool.hatch.build.targets.wheel.sources]
"nanoinfra" = "nanoinfra"

[tool.hatch.build.targets.sdist]
include = [
    "nanoinfra/",
    "nanoinfra/web/dist/",
    # The example connectors travel in the sdist. They are documentation people copy, and a `pip`
    # user has no checkout to copy them from.
    "examples/",
    "hatch_build.py",
    "README.md",
    "README_PYPI.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
exclude = ["nanoinfra/channels/*/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.basedpyright]
include = ["nanoinfra"]
exclude = ["**/tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "nanoinfra/channels"]

[tool.coverage.run]
source = ["nanoinfra"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
