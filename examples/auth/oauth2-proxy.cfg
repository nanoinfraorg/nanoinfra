# oauth2-proxy -- the options that oauth2-proxy.alpha.yaml does not own.
#
# oauth2-proxy refuses an option that the alpha file replaces. So the listen
# address, the upstream, the provider and every injected header live in that file,
# and the options here are the ones it cannot hold. This file is TOML.

# The address the browser comes back to after Dex authenticates the person.
# dex.yaml names the same address under `redirectURIs`, and Dex refuses any
# other one.
redirect_url = "http://127.0.0.1:4180/oauth2/callback"

# Nothing runs in front of oauth2-proxy in this example. `true` would make it
# read the client address out of an `X-Forwarded-For` header, and a client would
# then choose its own address.
reverse_proxy = false

# The example speaks HTTP on loopback, and a browser sends no secure cookie over
# HTTP. A deployment terminates TLS and sets this to `true`. That is one of the
# three things README.md says to change first.
cookie_secure = false

# A name of our own, so this cookie does not collide with another oauth2-proxy on
# the same loopback address.
cookie_name = "_nanoinfra_auth"

# This list decides who reaches the agent at all, and it is not the list that
# decides whose approval counts. config.json holds the second one.
#
# A file, and not `email_domains`. A domain admits every account it holds now and
# every account somebody creates in it later. A file names people. An empty file,
# or a `*` in it, admits whoever the provider will authenticate, which with a
# public provider is the internet.
authenticated_emails_file = "/etc/oauth2-proxy/oauth2-proxy.emails"

# One provider, so the sign-in button asks a question with one answer.
skip_provider_button = true
