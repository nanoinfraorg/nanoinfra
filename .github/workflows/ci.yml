name: Test Suite

on:
  push:
    branches: [main]
    paths-ignore:
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python_required: ${{ steps.paths.outputs.python_required }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python-relevant changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python_required=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          else
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            changed_files="$(git diff --name-only --no-renames "$diff_range")" &&
            [[ -n "$changed_files" ]] &&
            ! grep -qvE '^(webui/|nanoinfra/channels/[^/]+/webui/)' <<< "$changed_files"; then
            python_required=false
          fi

          echo "python_required=$python_required" >> "$GITHUB_OUTPUT"

  test:
    name: Python (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.python_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum, 3.11
            os: ubuntu-latest
            python-version: "3.11"
            coverage: false
            pytest_args: ""
          - name: latest, 3.14 + coverage
            os: ubuntu-latest
            python-version: "3.14"
            coverage: true
            pytest_args: ""

    # The Postgres-backed secrets tests skip themselves when NANOINFRA_TEST_POSTGRES_DSN is
    # unset, and it was set nowhere -- so five tests over an encrypted secret store ran in no
    # environment at all. A throwaway container is all they need. Declared for both lanes rather
    # than behind a matrix expression, because an empty `image:` is not a valid service; only the
    # coverage lane sets the DSN, so only it runs them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nanoinfra
          POSTGRES_PASSWORD: nanoinfra
          POSTGRES_DB: nanoinfra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nanoinfra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install channel dependencies
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels

      - name: Verify dependency consistency
        run: uv pip check

      # Channel requirements live in manifests rather than uv.lock. Avoid a
      # later uv run sync pruning the packages installed by the previous step.
      - name: Lint with ruff
        if: matrix.coverage
        run: uv run --no-sync ruff check nanoinfra tests conftest.py

      - name: Type check with BasedPyright (strict)
        if: matrix.coverage
        run: uv run --no-sync basedpyright

      - name: Run tests with coverage
        if: matrix.coverage
        env:
          NANOINFRA_TEST_POSTGRES_DSN: postgresql://nanoinfra:nanoinfra@localhost:5432/nanoinfra_test
        run: >-
          uv run --no-sync python -m pytest
          --cov=nanoinfra --cov-report=term-missing:skip-covered
          --durations=25 --durations-min=1.0

      # These tests skip themselves when Postgres is unset *or unreachable*, so a service
      # container that fails to come up would put the run straight back where it was: green, with
      # five tests over an encrypted secret store executed nowhere. Fail on a skip instead.
      - name: Confirm the Postgres secrets tests ran rather than skipped
        if: matrix.coverage
        env:
          NANOINFRA_TEST_POSTGRES_DSN: postgresql://nanoinfra:nanoinfra@localhost:5432/nanoinfra_test
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest tests/secrets/test_postgres_backend.py \
            -q -p no:randomly | tee /tmp/pg-secrets.log
          if grep -qE '[0-9]+ skipped' /tmp/pg-secrets.log; then
            echo "::error::Postgres secrets tests skipped; the service container is not reachable"
            exit 1
          fi

      - name: Run compatibility tests
        if: ${{ !matrix.coverage }}
        run: >-
          uv run --no-sync python -m pytest
          ${{ matrix.pytest_args }}
          --durations=25 --durations-min=1.0

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Verify npm lockfile
        working-directory: webui
        run: npm ci --ignore-scripts --dry-run

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Buildx with the Actions cache, which `publish-image.yml` already uses -- so this adds no
      # dependency, only the caching that job had and this one did not. A plain `docker build`
      # rebuilt every layer on every push, including the apt and uv steps, and this job swung
      # between 1.6 and 6.1 minutes doing it (#271).
      #
      # It matters more than its own minutes: once the test job is parallel, a six-minute image
      # build is what the release waits for.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with default channel dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          # Into the local daemon, because the steps below `docker run` it.
          load: true
          tags: nanoinfra:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify default WhatsApp dependencies
        run: docker run --rm --entrypoint python nanoinfra:test -c "import neonize, segno"

      - name: Verify runtime dependency permissions
        run: >-
          docker run --rm --user 1000:1000 --entrypoint sh nanoinfra:test -c
          'test -w /app/.venv && test ! -w /app && test ! -w /app/nanoinfra &&
          python -m scripts.install_channel_dependencies discord && python -c "import discord"'
