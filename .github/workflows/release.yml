name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build and publish (defaults to the triggering ref)"
        required: false

permissions:
  contents: read

jobs:
  require-tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/require-green-tests.yml
    with:
      sha: ${{ github.sha }}

  build-and-publish:
    name: Build and publish to PyPI
    needs: require-tests
    # `always()` so a manual dispatch, where the gate is skipped rather than run, still publishes.
    if: always() && (needs.require-tests.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # A tag with no changelog section is what turns the file from a record into a habit nobody
      # keeps. Before the build, because a published artifact whose changes are undocumented cannot
      # be un-published.
      - name: Require a changelog section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section. See AGENTS.md → Changelog and releases."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Build WebUI bundle
        working-directory: webui
        run: bun run build

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
