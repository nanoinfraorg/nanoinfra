# The public container image.
#
# This is the deployment that makes the privilege split real: the entrypoint starts
# as root, places the executor on nanoinfra-exec and the agent on nanoinfra, and
# drops root before either of them serves. Nothing about that is possible in a
# single-account install, so the image is the recommended way to run this in
# production and it belongs in a registry rather than in a build on your host.
#
# Version tags only. A push to main publishes nothing: the image people pull has
# to correspond to a release on PyPI, and `latest` moving on every merge would
# break that correspondence.
name: Publish image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  require-tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/require-green-tests.yml
    with:
      sha: ${{ github.sha }}

  publish:
    name: Build and push to GHCR
    needs: require-tests
    # `always()` so a manual dispatch, where the gate is skipped rather than run, still publishes.
    if: always() && (needs.require-tests.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nanoinfraorg/nanoinfra
          # `value=` rather than letting the action read the ref: a manual run is
          # dispatched from main and has to be able to publish an existing release,
          # which the ref alone does not say.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=nanoinfra
            org.opencontainers.image.description=Self-hosted agent for infrastructure, with a capability gate in a separate process
            org.opencontainers.image.licenses=MIT

      # linux/amd64 only. The image builds a WebUI with npm and a Python
      # environment with uv, and both would run under QEMU for a second
      # architecture -- minutes become tens of minutes on every release. Adding
      # arm64 is one line here when something actually needs it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what shipped
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
