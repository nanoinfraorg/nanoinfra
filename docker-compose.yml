x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOINFRA_CHANNELS: ${NANOINFRA_CHANNELS:-whatsapp}
  volumes:
    - ~/.nanoinfra:/home/nanoinfra/.nanoinfra
  cap_drop:
    - ALL
  # These five capabilities exist for the boot phase only. The container starts as
  # root, and entrypoint.sh needs them to build the item 15 (#18) privilege split:
  #   SETUID, SETGID   place the executor on nanoinfra-exec and the agent on
  #                    nanoinfra. Without these the drop from root fails and the
  #                    entrypoint refuses to run, because it never runs as root.
  #   CHOWN, FOWNER    hand the credential store and the audit log to the executor
  #                    account, and set the mode that keeps the agent out.
  #   DAC_OVERRIDE     create those directories inside the mounted data dir, which
  #                    belongs to the agent account and not to root.
  # A uid change clears the permitted set, so neither the agent nor the executor
  # holds any of these once it runs.
  cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE

services:
  nanoinfra-gateway:
    container_name: nanoinfra-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanoinfra-api:
    container_name: nanoinfra-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanoinfra/.nanoinfra/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanoinfra-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
