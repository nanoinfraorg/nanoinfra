x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOINFRA_CHANNELS: ${NANOINFRA_CHANNELS:-whatsapp}
  volumes:
    - ~/.nanoinfra:/home/nanoinfra/.nanoinfra
  cap_drop:
    - ALL

services:
  nanoinfra-gateway:
    container_name: nanoinfra-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanoinfra-api:
    container_name: nanoinfra-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanoinfra/.nanoinfra/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanoinfra-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
